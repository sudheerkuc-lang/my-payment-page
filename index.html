
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPI Payment - Sudheer Kumar</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #eee5ff, #f9f5ff);
}

.card {
  width: 100%;
  max-width: 380px;
  padding: 30px 24px;
  text-align: center;
  background: white;
  border-radius: 24px;
  box-shadow: 0 12px 40px #4b267b20;
}

.logo {
  width: 65px;
  height: 65px;
  line-height: 65px;
  margin: auto;
  border-radius: 50%;
  background: #f0e6ff;
  color: #673ab7;
  font-size: 30px;
}

h2 { color: #35204f; }

.subtitle { color: #777; }

.amount-label {
  display: block;
  margin: 24px 0 8px;
  font-weight: bold;
  text-align: left;
}

input {
  width: 100%;
  padding: 14px;
  border: 2px solid #ded0f5;
  border-radius: 10px;
  font-size: 20px;
  text-align: center;
  outline-color: #673ab7;
}

.pay {
  display: block;
  margin-top: 18px;
  padding: 16px;
  color: white;
  background: #673ab7;
  border: none;
  border-radius: 12px;
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  width: 100%;
}

.pay:active { background: #512795; }

.note {
  margin-top: 22px;
  color: #777;
  font-size: 12px;
  line-height: 1.6;
}
</style>
</head>

<body>
<div class="card">
  <div class="logo">₹</div>

  <h2>UPI Payment Request</h2>
  <p class="subtitle">Pay to Sudheer Kumar</p>

  <label class="amount-label" for="amount">
    Enter Amount (₹)
  </label>

  <input
    type="number"
    id="amount"
    placeholder="Enter amount"
    min="1"
    max="100000"
    step="0.01"
    inputmode="decimal"
  >

  <button class="pay" onclick="payNow()">
    Pay Now →
  </button>

  <p class="note">
    Verify the recipient's name and amount in your
    UPI app before approving the payment.
    Never share your UPI PIN.
  </p>
</div>

<script>
function payNow() {
  const input = document.getElementById("amount");
  const amount = Number(input.value);

  if (
    input.value.trim() === "" ||
    !Number.isFinite(amount) ||
    amount <= 0 ||
    amount > 100000 ||
    Math.round(amount * 100) !== amount * 100
  ) {
    alert("Please enter a valid amount between ₹1 and ₹1,00,000.");
    input.focus();
    return;
  }

  const params = new URLSearchParams({
    pa: "sudheerkasulanati@ybl",
    pn: "Sudheer Kumar",
    am: amount.toFixed(2),
    cu: "INR"
  });

  window.location.href = "upi://pay?" + params.toString();
}
</script>
</body>
</html>
